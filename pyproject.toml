[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-bench"
version = "0.1.0"
description = "Private-data conversational LLM benchmarking"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "openai>=1.60,<3", "google-genai>=1,<3",
  "typer>=0.12,<1", "rich>=13.7,<15", "pydantic>=2.7,<3",
  "pyyaml>=6,<7", "python-dotenv>=1,<2", "tiktoken>=0.7,<1",
  "jsonschema>=4.23,<5", "lingua-language-detector>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]

[project.scripts]
vbench = "llm_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
