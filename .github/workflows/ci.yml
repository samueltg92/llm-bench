name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-editable --extra dev --locked
      - run: uv run --no-editable ruff check .
      - run: uv run --no-editable pytest -q
      - run: python3 scripts/check_public.py --history
